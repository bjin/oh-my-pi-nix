name: Dispatch oh-my-pi AUR updater

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger bjin/oh-my-pi-bin-updater
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch updater workflow
        env:
          GH_TOKEN: ${{ secrets.AUR_UPDATER_DISPATCH_TOKEN }}
          TARGET_REPOSITORY: bjin/oh-my-pi-bin-updater
          EVENT_TYPE: oh-my-pi-nix-master
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "AUR_UPDATER_DISPATCH_TOKEN secret is not configured." >&2
            exit 1
          fi

          gh api --method POST "repos/${TARGET_REPOSITORY}/dispatches" \
            -f event_type="$EVENT_TYPE" \
            -f client_payload[repository]="$GITHUB_REPOSITORY" \
            -f client_payload[ref]="$GITHUB_REF" \
            -f client_payload[sha]="$GITHUB_SHA" \
            -f client_payload[run_id]="$GITHUB_RUN_ID"
